services:
  - type: web
    name: neo-backend
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_TYPE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: neo-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: neo-postgres
    databaseName: neo_db
    user: neo_user
    plan: free
