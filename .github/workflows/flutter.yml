name: Flutter CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
    paths-ignore:
      - 'backend/**'
      - 'admin/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'backend/**'
      - 'admin/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        
    - run: flutter pub get
    - run: flutter analyze
      continue-on-error: true
    - run: flutter test
      continue-on-error: true
    - run: flutter build web --release
    - run: flutter build apk --release
    - run: flutter build appbundle --release

    - name: Upload APK and AAB as Workflow Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: android-release-binaries
        path: |
          build/app/outputs/flutter-apk/app-release.apk
          build/app/outputs/bundle/release/app-release.aab

    - name: Update GitHub Release APK and AAB
      uses: ncipollo/release-action@v1
      if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
      with:
        tag: "v1.0.0"
        name: "Neo v1.0.0 Release"
        body: "Latest release of Neo Music App with cold-start timeout improvements and buffering fixes."
        artifacts: "build/app/outputs/flutter-apk/app-release.apk,build/app/outputs/bundle/release/app-release.aab"
        allowUpdates: true
        replacesArtifacts: true
        token: ${{ secrets.GITHUB_TOKEN }}
